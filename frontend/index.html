<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPINTAR - Sistem Informasi Pencarian Tugas Akhir</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .score-bar { height: 6px; border-radius: 9999px; }
    .tab-active { border-bottom: 3px solid #3b82f6; color: #1e40af; font-weight: 600; }
    .break-word { word-break: break-word; overflow-wrap: anywhere; }
    
    /* Gaya khusus untuk background hero */
    .hero-bg {
      background-image: url('/bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ============================================================ -->
  <!-- HEADER -->
  <!-- ============================================================ -->
  <header class="bg-white shadow-sm border-b z-20 relative">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4">
      <div class="flex flex-col sm:flex-row items-center sm:items-center gap-3 sm:gap-5 justify-center sm:justify-start">
        
        <!-- Logo -->
        <img
          src="/logo.png"
          alt="Logo Fasilkom UNEJ"
          class="h-12 sm:h-16 w-auto object-contain shrink-0"
          onerror="this.style.display='none'"
        />
        
        <!-- Title & Subtitle -->
        <div class="text-center sm:text-left">
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
            SIPINTAR
          </h1>
          <p class="text-xs sm:text-sm text-slate-500 font-medium mt-0.5">
            Sistem Informasi Pencarian Tugas Akhir
          </p>
        </div>

      </div>
    </div>
  </header>

  <!-- ============================================================ -->
  <!-- TABS -->
  <!-- ============================================================ -->
  <div class="bg-white border-b sticky top-0 z-10 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex justify-center sm:justify-start gap-8">
      <button id="tab-search" class="tab-btn tab-active py-3 px-1 text-sm sm:text-base text-slate-600" onclick="switchTab('search')">
        Pencarian
      </button>
      <button id="tab-eval" class="tab-btn py-3 px-1 text-sm sm:text-base text-slate-600" onclick="switchTab('eval')">
        Evaluasi
      </button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- MAIN -->
  <!-- ============================================================ -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full">

    <!-- TAB 1: PENCARIAN -->
    <section id="section-search">
      
      <!-- HERO SECTION DENGAN BACKGROUND GAMBAR -->
      <div class="hero-bg rounded-2xl overflow-hidden shadow-lg mb-6 relative">
        <!-- Overlay gelap agar tulisan dan kotak pencarian kontras -->
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[2px]"></div>
        
        <div class="relative z-10 px-4 py-10 sm:px-8 sm:py-16 flex flex-col items-center justify-center min-h-[250px]">
          <h2 class="text-white text-lg sm:text-2xl font-bold mb-6 drop-shadow-md text-center">
            Temukan Referensi Skripsi & Tugas Akhir
          </h2>
          
          <!-- Kotak Pencarian -->
          <div class="w-full max-w-3xl bg-white/95 backdrop-blur-sm rounded-xl shadow-xl p-2 sm:p-3 flex flex-col sm:flex-row gap-2 border border-white/20">
            <input
              id="query-input"
              type="text"
              placeholder="contoh: klasifikasi citra tanaman dengan CNN"
              class="flex-1 border-none bg-transparent px-4 py-2 text-sm sm:text-base focus:outline-none focus:ring-0 text-slate-800"
              onkeydown="if(event.key==='Enter') doSearch()"
            />
            <div class="flex gap-2">
              <select id="top-k" class="border border-slate-300 rounded-lg px-3 py-2 text-sm sm:text-base bg-white text-slate-700 outline-none">
                <option value="5">Top 5</option>
                <option value="10" selected>Top 10</option>
                <option value="15">Top 15</option>
                <option value="20">Top 20</option>
              </select>
              <button
                onclick="doSearch()"
                class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-6 py-2 rounded-lg font-medium text-sm sm:text-base transition shadow-md"
              >
                Cari
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Status & Hasil Pencarian -->
      <div id="search-status" class="mb-3 text-xs sm:text-sm text-slate-600 px-1"></div>
      <div id="search-results" class="space-y-3 sm:space-y-4"></div>
    </section>

    <!-- TAB 2: EVALUASI -->
    <section id="section-eval" class="hidden">
      <div id="eval-content" class="space-y-4 sm:space-y-6">
        <div class="text-slate-500 text-sm">Memuat data evaluasi...</div>
      </div>
    </section>

  </main>

  <footer class="max-w-7xl mx-auto px-4 sm:px-6 py-6 text-center text-[10px] sm:text-xs text-slate-400">
    2026 — SIPINTAR · Sistem Informasi Pencarian Tugas Akhir
  </footer>

  <!-- ============================================================ -->
  <script>
    // ============================================================
    // TAB SWITCHING
    // ============================================================
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
      document.getElementById('tab-' + tab).classList.add('tab-active');

      document.getElementById('section-search').classList.toggle('hidden', tab !== 'search');
      document.getElementById('section-eval').classList.toggle('hidden', tab !== 'eval');

      if (tab === 'eval') loadEvaluation();
    }

    // ============================================================
    // RANDOM DOCS ON LOAD
    // ============================================================
    async function loadRandomDocs() {
      const statusEl = document.getElementById('search-status');
      const resultsEl = document.getElementById('search-results');

      statusEl.innerHTML = 'Memuat dokumen...';
      resultsEl.innerHTML = '';

      try {
        const res = await fetch('/api/random?n=10');
        if (!res.ok) throw new Error('Gagal memuat dokumen');
        const data = await res.json();

        statusEl.innerHTML = `Menampilkan <b>${data.results.length}</b> dokumen acak. Ketik query di atas untuk mencari.`;
        resultsEl.innerHTML = data.results.map(r => renderResult(r, false)).join('');
      } catch (e) {
        statusEl.innerHTML = `<span class="text-red-600">Error: ${escapeHtml(e.message)}</span>`;
      }
    }

    // ============================================================
    // SEARCH
    // ============================================================
    async function doSearch() {
      const query = document.getElementById('query-input').value.trim();
      const topK = parseInt(document.getElementById('top-k').value);
      if (!query) return;

      const statusEl = document.getElementById('search-status');
      const resultsEl = document.getElementById('search-results');

      statusEl.innerHTML = `Mencari <b>"${escapeHtml(query)}"</b>...`;
      resultsEl.innerHTML = '';

      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, top_k: topK }),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();

        statusEl.innerHTML = `Ditemukan <b>${data.results.length}</b> hasil untuk <b>"${escapeHtml(data.query)}"</b> dalam <b>${data.elapsed_ms} ms</b>`;
        resultsEl.innerHTML = data.results.map(r => renderResult(r, true)).join('');
      } catch (e) {
        statusEl.innerHTML = `<span class="text-red-600">Error: ${escapeHtml(e.message)}</span>`;
      }
    }

    // ============================================================
    // RENDER CARD
    // ============================================================
    function renderResult(r, showScores) {
      const scores = r.scores;
      const scoreSection = showScores ? `
        <div class="mt-3 sm:mt-4 pt-3 border-t border-slate-100">
          <div class="text-[10px] sm:text-[11px] font-medium text-slate-500 mb-2">
            Perbandingan skor 4 metode
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3">
            ${renderScoreBar('Cosine', scores.cosine, 'bg-blue-500')}
            ${renderScoreBar('Jaccard', scores.jaccard, 'bg-amber-500')}
            ${renderScoreBar('Dice', scores.dice, 'bg-emerald-500')}
            ${renderScoreBar('Overlap', scores.overlap, 'bg-rose-500')}
          </div>
        </div>
      ` : '';

      const scoreBadge = showScores ? `
        <div class="text-right shrink-0">
          <div class="text-xl sm:text-2xl font-bold text-blue-600">${scores.cosine.toFixed(3)}</div>
          <div class="text-[9px] sm:text-[10px] text-slate-400">cosine</div>
        </div>
      ` : '';

      return `
        <div class="bg-white rounded-xl shadow-sm p-4 sm:p-5 hover:shadow-md transition border border-slate-100">
          <div class="flex items-start justify-between gap-3 mb-2">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1 flex-wrap">
                <span class="bg-blue-100 text-blue-700 text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded">
                  #${r.rank}
                </span>
                <span class="text-[10px] sm:text-xs text-slate-500">
                  doc_id=${r.doc_id} · ${r.tahun || '-'}
                </span>
              </div>
              <h3 class="font-semibold text-sm sm:text-base text-slate-900 leading-snug break-word">
                ${escapeHtml(r.judul)}
              </h3>
              <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 truncate">
                ${escapeHtml(r.penulis)}
              </p>
            </div>
            ${scoreBadge}
          </div>

          <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mt-2 break-word">
            ${escapeHtml(r.abstrak)}
          </p>

          ${scoreSection}
        </div>
      `;
    }

    function renderScoreBar(label, val, colorClass) {
      const pct = Math.min(val * 100, 100);
      return `
        <div>
          <div class="flex justify-between text-[10px] text-slate-500 mb-1">
            <span>${label}</span>
            <span class="font-mono">${val.toFixed(3)}</span>
          </div>
          <div class="bg-slate-100 score-bar">
            <div class="${colorClass} score-bar" style="width: ${pct}%"></div>
          </div>
        </div>
      `;
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    // ============================================================
    // EVALUATION
    // ============================================================
    let evalChart = null;

    async function loadEvaluation() {
      const el = document.getElementById('eval-content');
      try {
        const res = await fetch('/api/evaluation');
        const data = await res.json();

        if (!data.available) {
          el.innerHTML = `<div class="bg-amber-50 border border-amber-200 rounded-lg p-4 text-amber-800 text-sm">${escapeHtml(data.message)}</div>`;
          return;
        }

        const summary = data.summary;
        const best = summary.reduce((a, b) => a['f1@k'] > b['f1@k'] ? a : b);

        el.innerHTML = `
          <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl shadow p-4 sm:p-6">
            <div class="text-xs sm:text-sm opacity-90">Metode terbaik berdasarkan F1@10</div>
            <div class="text-2xl sm:text-3xl font-bold mt-1">${best.metode.toUpperCase()}</div>
            <div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-6 text-xs sm:text-sm">
              <div>F1: <b>${best['f1@k'].toFixed(4)}</b></div>
              <div>Precision: <b>${best['precision@k'].toFixed(4)}</b></div>
              <div>Recall: <b>${best['recall@k'].toFixed(4)}</b></div>
              <div>MAP: <b>${best['map@k'].toFixed(4)}</b></div>
            </div>
          </div>

          <div class="bg-white rounded-xl shadow-sm p-4 sm:p-6 border border-slate-100">
            <h2 class="font-semibold text-base sm:text-lg mb-3 sm:mb-4">Tabel Perbandingan (macro average @K=10)</h2>
            <div class="overflow-x-auto -mx-4 sm:mx-0 px-4 sm:px-0">
              <table class="w-full text-xs sm:text-sm min-w-[480px]">
                <thead>
                  <tr class="border-b text-left text-slate-500">
                    <th class="py-2">Metode</th>
                    <th class="py-2 text-right">Precision@10</th>
                    <th class="py-2 text-right">Recall@10</th>
                    <th class="py-2 text-right">F1@10</th>
                    <th class="py-2 text-right">MAP@10</th>
                  </tr>
                </thead>
                <tbody>
                  ${summary.map(r => `
                    <tr class="border-b ${r.metode === best.metode ? 'bg-blue-50 font-semibold' : ''}">
                      <td class="py-2 capitalize">${r.metode}${r.metode === best.metode ? ' (terbaik)' : ''}</td>
                      <td class="py-2 text-right font-mono">${r['precision@k'].toFixed(4)}</td>
                      <td class="py-2 text-right font-mono">${r['recall@k'].toFixed(4)}</td>
                      <td class="py-2 text-right font-mono">${r['f1@k'].toFixed(4)}</td>
                      <td class="py-2 text-right font-mono">${r['map@k'].toFixed(4)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="bg-white rounded-xl shadow-sm p-4 sm:p-6 border border-slate-100">
            <h2 class="font-semibold text-base sm:text-lg mb-3 sm:mb-4">Grafik Perbandingan</h2>
            <div class="w-full">
              <canvas id="eval-chart"></canvas>
            </div>
          </div>

          <div class="bg-white rounded-xl shadow-sm p-4 sm:p-6 border border-slate-100">
            <h2 class="font-semibold text-base sm:text-lg mb-3 sm:mb-4">Detail Ground Truth</h2>
            <div class="text-xs sm:text-sm text-slate-600 mb-2">
              Total query: <b>${Object.keys(data.ground_truth).length}</b> ·
              Total dokumen relevan: <b>${Object.values(data.ground_truth).reduce((s, v) => s + v.num_relevant, 0)}</b>
            </div>
            <div class="overflow-x-auto -mx-4 sm:mx-0 px-4 sm:px-0 mt-3">
              <table class="w-full text-xs sm:text-sm min-w-[400px]">
                <thead>
                  <tr class="border-b text-left text-slate-500">
                    <th class="py-2">Query</th>
                    <th class="py-2 text-right">Jumlah Relevan</th>
                  </tr>
                </thead>
                <tbody>
                  ${Object.entries(data.ground_truth).map(([q, v]) => `
                    <tr class="border-b">
                      <td class="py-2 text-slate-700 break-word">${escapeHtml(q)}</td>
                      <td class="py-2 text-right font-mono">${v.num_relevant}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;

        renderChart(summary);
      } catch (e) {
        el.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-800 text-sm">Error: ${escapeHtml(e.message)}</div>`;
      }
    }

    function renderChart(summary) {
      const ctx = document.getElementById('eval-chart');
      if (!ctx) return;

      if (evalChart) evalChart.destroy();

      const labels = ['Precision@10', 'Recall@10', 'F1@10', 'MAP@10'];
      const colors = {
        cosine:  '#3b82f6',
        jaccard: '#f59e0b',
        dice:    '#10b981',
        overlap: '#f43f5e',
      };

      const datasets = summary.map(r => ({
        label: r.metode.charAt(0).toUpperCase() + r.metode.slice(1),
        data: [r['precision@k'], r['recall@k'], r['f1@k'], r['map@k']],
        backgroundColor: colors[r.metode],
        borderRadius: 6,
      }));

      evalChart = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
            tooltip: {
              callbacks: {
                label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(4)}`,
              },
            },
          },
          scales: {
            y: { beginAtZero: true, max: 1.05, ticks: { stepSize: 0.2, font: { size: 10 } } },
            x: { ticks: { font: { size: 10 } } },
          },
        },
      });
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', loadRandomDocs);
  </script>
</body>
</html>
