<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IR Skripsi Fasilkom UNEJ — Perbandingan Similarity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .score-bar { height: 6px; border-radius: 9999px; }
    .tab-active { border-bottom: 3px solid #3b82f6; color: #1e40af; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- HEADER -->
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-900">
          IR Skripsi Fasilkom UNEJ
        </h1>
        <p class="text-xs text-slate-500">
          Perbandingan Cosine, Jaccard, Sørensen-Dice, Overlap Similarity
        </p>
      </div>
      <div class="text-sm text-slate-500">
        <span class="font-mono bg-slate-100 px-2 py-1 rounded">587 dokumen</span>
      </div>
    </div>
  </header>

  <!-- TABS -->
  <div class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-6 flex gap-8">
      <button id="tab-search" class="tab-btn tab-active py-3 px-1 text-slate-600" onclick="switchTab('search')">
        Pencarian
      </button>
      <button id="tab-eval" class="tab-btn py-3 px-1 text-slate-600" onclick="switchTab('eval')">
        Evaluasi
      </button>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- ================================================ -->
    <!-- TAB 1: PENCARIAN -->
    <!-- ================================================ -->
    <section id="section-search">
      <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Masukkan query pencarian
        </label>
        <div class="flex gap-3">
          <input
            id="query-input"
            type="text"
            placeholder="contoh: klasifikasi citra tanaman dengan CNN"
            class="flex-1 border border-slate-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
            onkeydown="if(event.key==='Enter') doSearch()"
          />
          <select id="top-k" class="border border-slate-300 rounded-lg px-3 py-2.5 bg-white">
            <option value="5">Top 5</option>
            <option value="10" selected>Top 10</option>
            <option value="15">Top 15</option>
            <option value="20">Top 20</option>
          </select>
          <button
            onclick="doSearch()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium transition"
          >
            Cari
          </button>
        </div>
      </div>

      <!-- STATUS -->
      <div id="search-status" class="hidden mb-4 text-sm text-slate-600"></div>

      <!-- HASIL -->
      <div id="search-results" class="space-y-4"></div>
    </section>

    <!-- ================================================ -->
    <!-- TAB 2: EVALUASI -->
    <!-- ================================================ -->
    <section id="section-eval" class="hidden">
      <div id="eval-content" class="space-y-6">
        <div class="text-slate-500">Memuat data evaluasi...</div>
      </div>
    </section>

  </main>

  <footer class="max-w-7xl mx-auto px-6 py-8 text-center text-xs text-slate-400">
    2026 — Sistem Temu Kembali Informasi, Skripsi Fasilkom UNEJ
  </footer>

  <!-- ============================================================ -->
  <script>
    // ============================================================
    // TAB SWITCHING
    // ============================================================
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
      document.getElementById('tab-' + tab).classList.add('tab-active');

      document.getElementById('section-search').classList.toggle('hidden', tab !== 'search');
      document.getElementById('section-eval').classList.toggle('hidden', tab !== 'eval');

      if (tab === 'eval') loadEvaluation();
    }

    // ============================================================
    // SEARCH
    // ============================================================
    async function doSearch() {
      const query = document.getElementById('query-input').value.trim();
      const topK = parseInt(document.getElementById('top-k').value);
      if (!query) return;

      const statusEl = document.getElementById('search-status');
      const resultsEl = document.getElementById('search-results');

      statusEl.classList.remove('hidden');
      statusEl.innerHTML = `Mencari <b>"${escapeHtml(query)}"</b>...`;
      resultsEl.innerHTML = '';

      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, top_k: topK }),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();

        statusEl.innerHTML = `Ditemukan <b>${data.results.length}</b> hasil untuk <b>"${escapeHtml(data.query)}"</b> dalam <b>${data.elapsed_ms} ms</b>`;
        resultsEl.innerHTML = data.results.map(r => renderResult(r)).join('');
      } catch (e) {
        statusEl.innerHTML = `<span class="text-red-600">Error: ${escapeHtml(e.message)}</span>`;
      }
    }

    function renderResult(r) {
      const scores = r.scores;
      return `
        <div class="bg-white rounded-xl shadow-sm p-5 hover:shadow-md transition">
          <div class="flex items-start justify-between gap-4 mb-2">
            <div class="flex-1">
              <div class="flex items-center gap-2 mb-1">
                <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded">#${r.rank}</span>
                <span class="text-xs text-slate-500">doc_id=${r.doc_id} · ${r.tahun || '-'}</span>
              </div>
              <h3 class="font-semibold text-slate-900 leading-snug">${escapeHtml(r.judul)}</h3>
              <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(r.penulis)}</p>
            </div>
            <div class="text-right shrink-0">
              <div class="text-2xl font-bold text-blue-600">${scores.cosine.toFixed(3)}</div>
              <div class="text-[10px] text-slate-400">cosine score</div>
            </div>
          </div>

          <p class="text-sm text-slate-600 leading-relaxed mt-2">${escapeHtml(r.abstrak)}</p>

          <div class="mt-4 pt-3 border-t border-slate-100">
            <div class="text-[11px] font-medium text-slate-500 mb-2">Perbandingan skor 4 metode:</div>
            <div class="grid grid-cols-4 gap-3">
              ${renderScoreBar('Cosine', scores.cosine, 'bg-blue-500')}
              ${renderScoreBar('Jaccard', scores.jaccard, 'bg-amber-500')}
              ${renderScoreBar('Dice', scores.dice, 'bg-emerald-500')}
              ${renderScoreBar('Overlap', scores.overlap, 'bg-rose-500')}
            </div>
          </div>
        </div>
      `;
    }

    function renderScoreBar(label, val, colorClass) {
      const pct = Math.min(val * 100, 100);
      return `
        <div>
          <div class="flex justify-between text-[10px] text-slate-500 mb-1">
            <span>${label}</span>
            <span class="font-mono">${val.toFixed(3)}</span>
          </div>
          <div class="bg-slate-100 score-bar">
            <div class="${colorClass} score-bar" style="width: ${pct}%"></div>
          </div>
        </div>
      `;
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    // ============================================================
    // EVALUATION
    // ============================================================
    let evalChart = null;

    async function loadEvaluation() {
      const el = document.getElementById('eval-content');
      try {
        const res = await fetch('/api/evaluation');
        const data = await res.json();

        if (!data.available) {
          el.innerHTML = `<div class="bg-amber-50 border border-amber-200 rounded-lg p-4 text-amber-800">${escapeHtml(data.message)}</div>`;
          return;
        }

        const summary = data.summary;
        const best = summary.reduce((a, b) => a['f1@k'] > b['f1@k'] ? a : b);

        el.innerHTML = `
          <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl shadow p-6">
            <div class="text-sm opacity-90">Metode terbaik berdasarkan F1@10</div>
            <div class="text-3xl font-bold mt-1">${best.metode.toUpperCase()}</div>
            <div class="mt-2 flex gap-6 text-sm">
              <div>F1: <b>${best['f1@k'].toFixed(4)}</b></div>
              <div>Precision: <b>${best['precision@k'].toFixed(4)}</b></div>
              <div>Recall: <b>${best['recall@k'].toFixed(4)}</b></div>
              <div>MAP: <b>${best['map@k'].toFixed(4)}</b></div>
            </div>
          </div>

          <div class="bg-white rounded-xl shadow-sm p-6">
            <h2 class="font-semibold text-lg mb-4">Tabel Perbandingan (macro average @K=10)</h2>
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b text-left text-slate-500">
                  <th class="py-2">Metode</th>
                  <th class="py-2 text-right">Precision@10</th>
                  <th class="py-2 text-right">Recall@10</th>
                  <th class="py-2 text-right">F1@10</th>
                  <th class="py-2 text-right">MAP@10</th>
                </tr>
              </thead>
              <tbody>
                ${summary.map(r => `
                  <tr class="border-b ${r.metode === best.metode ? 'bg-blue-50 font-semibold' : ''}">
                    <td class="py-2 capitalize">${r.metode}${r.metode === best.metode ? ' (terbaik)' : ''}</td>
                    <td class="py-2 text-right font-mono">${r['precision@k'].toFixed(4)}</td>
                    <td class="py-2 text-right font-mono">${r['recall@k'].toFixed(4)}</td>
                    <td class="py-2 text-right font-mono">${r['f1@k'].toFixed(4)}</td>
                    <td class="py-2 text-right font-mono">${r['map@k'].toFixed(4)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <div class="bg-white rounded-xl shadow-sm p-6">
            <h2 class="font-semibold text-lg mb-4">Grafik Perbandingan</h2>
            <canvas id="eval-chart" height="100"></canvas>
          </div>

          <div class="bg-white rounded-xl shadow-sm p-6">
            <h2 class="font-semibold text-lg mb-4">Detail Ground Truth</h2>
            <div class="text-sm text-slate-600 mb-2">
              Total query: <b>${Object.keys(data.ground_truth).length}</b> ·
              Total dokumen relevan: <b>${Object.values(data.ground_truth).reduce((s, v) => s + v.num_relevant, 0)}</b>
            </div>
            <table class="w-full text-sm mt-3">
              <thead>
                <tr class="border-b text-left text-slate-500">
                  <th class="py-2">Query</th>
                  <th class="py-2 text-right">Jumlah Relevan</th>
                </tr>
              </thead>
              <tbody>
                ${Object.entries(data.ground_truth).map(([q, v]) => `
                  <tr class="border-b">
                    <td class="py-2 text-slate-700">${escapeHtml(q)}</td>
                    <td class="py-2 text-right font-mono">${v.num_relevant}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        renderChart(summary);
      } catch (e) {
        el.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-800">Error: ${escapeHtml(e.message)}</div>`;
      }
    }

    function renderChart(summary) {
      const ctx = document.getElementById('eval-chart');
      if (!ctx) return;

      if (evalChart) evalChart.destroy();

      const labels = ['Precision@10', 'Recall@10', 'F1@10', 'MAP@10'];
      const colors = {
        cosine:  '#3b82f6',
        jaccard: '#f59e0b',
        dice:    '#10b981',
        overlap: '#f43f5e',
      };

      const datasets = summary.map(r => ({
        label: r.metode.charAt(0).toUpperCase() + r.metode.slice(1),
        data: [r['precision@k'], r['recall@k'], r['f1@k'], r['map@k']],
        backgroundColor: colors[r.metode],
        borderRadius: 6,
      }));

      evalChart = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'top' },
            tooltip: {
              callbacks: {
                label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(4)}`,
              },
            },
          },
          scales: {
            y: { beginAtZero: true, max: 1.05, ticks: { stepSize: 0.2 } },
          },
        },
      });
    }
  </script>
</body>
</html>
